name: SupportOID CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run build:js
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bunx playwright install chromium
      - run: bun run test:browser
        env:
          SUPPORTOID_TEST_PYTHON: python
          SUPPORTOID_RUN_LIVE_LLM_TESTS: '0'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd frontend verify

  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd convex-adapter format:check
      - run: bun run build:adapter
